[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "security-log-analyzer"
version = "1.0.0"
description = "CLI that analyses Linux auth logs and Apache/Nginx access logs for brute force, scanners, SQLi, XSS and path traversal, with terminal, JSON, CSV and HTML reports."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joseph Obaje", email = "josephobaje264@gmail.com" }]
keywords = ["security", "log-analysis", "sshd", "apache", "nginx", "intrusion-detection", "blue-team", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = ["rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5", "mypy>=1.8"]

[project.scripts]
seclog = "seclog.cli:main"

[project.urls]
Homepage = "https://github.com/Josephobaje/security-log-analyzer"
Repository = "https://github.com/Josephobaje/security-log-analyzer"
Issues = "https://github.com/Josephobaje/security-log-analyzer/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seclog = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["seclog"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "RUF", "N", "C4", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["S311", "T201"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/seclog", "scripts"]
